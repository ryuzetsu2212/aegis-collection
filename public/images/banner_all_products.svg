<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Decorative Circles -->
  <circle cx="700" cy="100" r="180" fill="#fbbf24" opacity="0.05"/>
  <circle cx="100" cy="400" r="150" fill="#3b82f6" opacity="0.05"/>
  <circle cx="400" cy="250" r="250" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8 8" fill="none" opacity="0.15"/>

  <!-- Main Shopping Bag Icon Graphic -->
  <g transform="translate(400, 210)" filter="url(#shadow)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="110" fill="url(#goldGrad)" opacity="0.15"/>
    <circle cx="0" cy="0" r="90" fill="#27272a" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Shopping Bag Vector -->
    <path d="M-35 -20 L-45 45 C-45 52 -38 58 -30 58 L30 58 C38 58 45 52 45 45 L35 -20 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Bag Handles -->
    <path d="M-20 -20 C-20 -45 20 -45 20 -20" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Sparkles -->
    <path d="M-60 -50 L-55 -40 L-45 -35 L-55 -30 L-60 -20 L-65 -30 L-75 -35 L-65 -40 Z" fill="#fbbf24"/>
    <path d="M55 20 L58 27 L65 30 L58 33 L55 40 L52 33 L45 30 L52 27 Z" fill="#fbbf24"/>
  </g>

  <!-- Discount Badge -->
  <g transform="translate(490, 130)" filter="url(#shadow)">
    <rect x="-60" y="-25" width="120" height="50" rx="25" fill="url(#badgeGrad)"/>
    <text x="0" y="8" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">50% OFF</text>
  </g>

  <!-- Banner Subtext Graphic -->
  <text x="400" y="380" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" text-anchor="middle" letter-spacing="1">SEMUA PRODUK FASHION</text>
  <text x="400" y="415" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" text-anchor="middle">AEGIS COLLECTION • PROMO SPESIAL TOKO</text>
</svg>
